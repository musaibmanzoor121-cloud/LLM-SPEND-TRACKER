databases:
  - name: watchdog-db
    databaseName: watchdog
    user: watchdog_user
    plan: free

services:
  - type: web
    name: watchdog-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: watchdog-db
          property: connectionString
      - key: ENCRYPTION_KEY
        sync: false # You will provide this in the Render dashboard
      - key: JWT_SECRET
        sync: false # You will provide this in the Render dashboard
      - key: RESEND_API_KEY
        sync: false # You will provide this in the Render dashboard
